<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="Caspian &amp; Black Sea Monitor product logo">
  <title>Caspian &amp; Black Sea Monitor product logo</title>
  <desc>Layered sea routes and a highlighted monitoring point.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><path class="blue" d="M16 51c12-10 24-10 36 0s24 10 36 0 24-10 36 0"/><path class="cyan" d="M16 73c12-10 24-10 36 0s24 10 36 0 24-10 36 0"/><path class="blue" d="M16 95c12-10 24-10 36 0s24 10 36 0 24-10 36 0"/><circle class="amber-fill" cx="99" cy="39" r="7"/><path class="amber" d="M99 24v7m14 8h-7"/></g>
  <text class="wordmark" x="145" y="65" font-size="35">Caspian &amp; Black</text>
  <text class="wordmark" x="145" y="111" font-size="35">Sea Monitor</text>
</svg>
