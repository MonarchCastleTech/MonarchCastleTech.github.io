<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="Climate Security Index product logo">
  <title>Climate Security Index product logo</title>
  <desc>A globe with climate bands and a highlighted signal.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><circle class="blue" cx="66" cy="78" r="42"/><path class="cyan" d="M27 70h78M31 91h70M66 37c-12 12-18 25-18 41s6 30 18 42m0-83c12 12 18 25 18 41s-6 30-18 42"/><circle class="amber-fill" cx="97" cy="46" r="7"/><path class="amber" d="M97 27v8m17 11h-8"/></g>
  <text class="wordmark" x="145" y="65" font-size="35">Climate Security</text>
  <text class="wordmark" x="145" y="111" font-size="35">Index</text>
</svg>
