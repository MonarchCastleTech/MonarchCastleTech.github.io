<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="GeoRisk product logo">
  <title>GeoRisk product logo</title>
  <desc>A location marker sits over mapped terrain contours.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><path class="blue" d="M66 120S29 80 29 59a37 37 0 1 1 74 0c0 21-37 61-37 61Z"/><circle class="cyan" cx="66" cy="58" r="17"/><path class="amber" d="M54 62c8-9 16-9 24 0M58 70c6-6 10-6 16 0"/><circle class="amber-fill" cx="66" cy="52" r="4"/></g>
  <text class="wordmark" x="145" y="91" font-size="40">GeoRisk</text>
</svg>
