<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="Sanctions Exposure Index product logo">
  <title>Sanctions Exposure Index product logo</title>
  <desc>A network path is interrupted at a clear exposure boundary.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><path class="blue" d="M27 48 55 68m20 1 22-22M27 108l28-20m20-1 22 21"/><path class="cyan" d="M27 48h28m20 21h22M27 108h28m20-20h22"/><circle class="blue-fill" cx="27" cy="48" r="7"/><circle class="blue-fill" cx="27" cy="108" r="7"/><circle class="cyan-fill" cx="99" cy="48" r="7"/><circle class="cyan-fill" cx="99" cy="108" r="7"/><path class="amber" d="M66 44v27m0 14v26m-11-13h22"/></g>
  <text class="wordmark" x="145" y="65" font-size="40">Sanctions</text>
  <text class="wordmark" x="145" y="111" font-size="40">Exposure Index</text>
</svg>
