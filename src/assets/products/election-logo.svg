<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="Election Monitor product logo">
  <title>Election Monitor product logo</title>
  <desc>A monitored ballot pairs a verified choice with signal arcs.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><path class="blue" d="M31 35h58v82H31z"/><path class="cyan" d="M43 54h33M43 101h19"/><path class="amber" d="m44 78 10 10 19-23"/><path class="blue" d="M98 53c8 8 8 20 0 28m8-38c14 14 14 34 0 48"/></g>
  <text class="wordmark" x="145" y="91" font-size="35">Election Monitor</text>
</svg>
