<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="Defense Procurement Intelligence product logo">
  <title>Defense Procurement Intelligence product logo</title>
  <desc>A procurement record combines inventory, review lines, and an approval mark.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><path class="blue" d="M34 31h51l15 15v69H34z"/><path class="cyan" d="M84 31v17h16M47 62h40M47 76h27M47 90h18"/><path class="amber" d="m70 101 8 8 18-20"/><rect class="blue-fill" x="22" y="48" width="12" height="63" rx="2"/></g>
  <text class="wordmark" x="145" y="49" font-size="40">Defense</text>
  <text class="wordmark" x="145" y="87" font-size="40">Procurement</text>
  <text class="wordmark" x="145" y="125" font-size="40">Intelligence</text>
</svg>
