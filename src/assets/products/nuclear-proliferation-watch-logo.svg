<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" role="img" aria-label="Nuclear Proliferation Watch product logo">
  <title>Nuclear Proliferation Watch product logo</title>
  <desc>A contained atomic core and orbital paths signal nuclear monitoring.</desc>
  <style>
    :root { --logo-blue: #2f7de1; --logo-cyan: #38b8d6; --logo-amber: #d7b46a; --logo-ink: #f3efe4; }
    .blue, .cyan, .amber { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .blue { stroke: var(--logo-blue); }
    .cyan { stroke: var(--logo-cyan); }
    .amber { stroke: var(--logo-amber); }
    .blue-fill { fill: var(--logo-blue); }
    .cyan-fill { fill: var(--logo-cyan); }
    .amber-fill { fill: var(--logo-amber); }
    .wordmark { fill: var(--logo-blue); font-family: Inter, "Helvetica Neue", Arial, ui-sans-serif, sans-serif; font-weight: 700; letter-spacing: -0.8px; }
  </style>
  <g aria-hidden="true"><ellipse class="blue" cx="66" cy="78" rx="42" ry="15"/><ellipse class="cyan" cx="66" cy="78" rx="42" ry="15" transform="rotate(60 66 78)"/><ellipse class="blue" cx="66" cy="78" rx="42" ry="15" transform="rotate(120 66 78)"/><circle class="amber-fill" cx="66" cy="78" r="7"/><circle class="cyan-fill" cx="104" cy="78" r="5"/></g>
  <text class="wordmark" x="145" y="49" font-size="40">Nuclear</text>
  <text class="wordmark" x="145" y="87" font-size="40">Proliferation</text>
  <text class="wordmark" x="145" y="125" font-size="40">Watch</text>
</svg>
